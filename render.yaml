services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend REST API Web Service
  # -------------------------------------------------------------
  - type: web
    name: text-summarization-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: chmod +x start.sh && ./start.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: ./backend:.
      - key: DEVICE
        value: cpu
      - key: DATABASE_URL
        value: sqlite:///./data/summarai.db
      - key: MLFLOW_TRACKING_URI
        value: http://127.0.0.1:5000

  # -------------------------------------------------------------
  # 2. React + Vite Frontend Static Site
  # -------------------------------------------------------------
  - type: web
    name: text-summarization-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: text-summarization-backend
          property: host
