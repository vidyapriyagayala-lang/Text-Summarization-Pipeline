services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend REST API Web Service
  # -------------------------------------------------------------
  - type: web
    name: text-summarization-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt && python scripts/prepare_data.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: DEVICE
        value: cpu
      - key: DATABASE_URL
        value: sqlite:///./data/summarai.db
      - key: MLFLOW_TRACKING_URI
        value: http://127.0.0.1:5000

  # -------------------------------------------------------------
  # 2. React + Vite Frontend Static Site
  # -------------------------------------------------------------
  - type: web
    name: text-summarization-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: text-summarization-backend
          property: host
